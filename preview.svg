<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 392 98" width="1176" height="294"
     role="img" aria-label="OmaDock: a terminal-style command strip showing ghostty focused, zen-browser running, and files idle">
  <title>OmaDock</title>
  <desc>The dock renders as a single bordered command strip: a prompt, then one
  monochrome glyph and lowercase command label per application. An accent rule
  marks the focused application, a short dim rule marks one that is merely
  running, and a pinned application that is not running stays dim with no rule.</desc>

  <defs>
    <!-- OmaDock default palette (Commons/Color.qml fallbacks). Themes replace
         these at runtime; the geometry below is the real layout at 1x. -->
    <style>
      .surface   { fill: #101315; }
      .border    { fill: none; stroke: #cacccc; stroke-opacity: 0.4; stroke-width: 1; }
      .prompt    { fill: none; stroke: #7aa88a; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
      .glyph     { fill: #cacccc; }
      .glyph-dim { fill: #cacccc; fill-opacity: 0.45; }
      .label     { fill: #cacccc; font-family: "JetBrains Mono", "DejaVu Sans Mono", monospace; font-size: 11px; }
      .label-dim { fill: #cacccc; fill-opacity: 0.45; font-family: "JetBrains Mono", "DejaVu Sans Mono", monospace; font-size: 11px; }
      .rule-active  { fill: #7aa88a; }
      .rule-running { fill: #cacccc; fill-opacity: 0.55; }
      .caption   { fill: #707880; font-family: "JetBrains Mono", "DejaVu Sans Mono", monospace; font-size: 7px; }
      .leader    { stroke: #707880; stroke-width: 0.5; stroke-opacity: 0.7; fill: none; }
    </style>

    <!-- Terminal glyph: a 16x16 box drawn once, reused per item. -->
    <g id="glyph-terminal">
      <rect x="0.75" y="2.75" width="14.5" height="10.5" rx="1.5" fill="none"
            stroke="currentColor" stroke-width="1.5"/>
      <path d="M4 6.2 L6.4 8 L4 9.8" fill="none" stroke="currentColor"
            stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="7.6" y="9.4" width="4.4" height="1.4" rx="0.7" fill="currentColor"/>
    </g>

    <!-- Browser glyph: ring with an inner crescent. -->
    <g id="glyph-browser">
      <circle cx="8" cy="8" r="6.4" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <circle cx="6.4" cy="8" r="3.1" fill="currentColor"/>
    </g>

    <!-- Folder glyph. -->
    <g id="glyph-folder">
      <path d="M1 4.4 A1.4 1.4 0 0 1 2.4 3 H6.2 L7.8 4.8 H13.6 A1.4 1.4 0 0 1 15 6.2
               V11.6 A1.4 1.4 0 0 1 13.6 13 H2.4 A1.4 1.4 0 0 1 1 11.6 Z"
            fill="currentColor"/>
    </g>
  </defs>

  <g transform="translate(30 12)">
    <!-- The strip: one surface, one border. Items carry no chrome of their own. -->
    <rect class="surface" x="0.5" y="0.5" width="287" height="37" rx="10"/>
    <rect class="border"  x="0.5" y="0.5" width="287" height="37" rx="10"/>

    <!-- Prompt -->
    <path class="prompt" d="M8.4 15.2 L12.6 19 L8.4 22.8"/>

    <!-- ghostty — focused: accent rule spanning the glyph and label -->
    <g transform="translate(27 11)" color="#cacccc">
      <use href="#glyph-terminal" class="glyph"/>
      <text class="label" x="22" y="12">ghostty</text>
      <rect class="rule-active" x="0" y="18" width="68" height="2" rx="1"/>
    </g>

    <!-- zen-browser — running but not focused: short dim rule -->
    <g transform="translate(111 11)" color="#cacccc">
      <use href="#glyph-browser" class="glyph"/>
      <text class="label" x="22" y="12">zen-browser</text>
      <rect class="rule-running" x="41.5" y="18" width="12" height="2" rx="1"/>
    </g>

    <!-- files — pinned but not running: dim, no rule -->
    <g transform="translate(222 11)" color="#cacccc" opacity="0.45">
      <use href="#glyph-folder" class="glyph"/>
      <text class="label" x="22" y="12">files</text>
    </g>
  </g>

  <!-- State legend. Each leader drops from the centre of the item it describes,
       starting just below the strip so none of them overlap the surface. -->
  <g>
    <path class="leader" d="M91 52 V70 H60"/>
    <text class="caption" x="57" y="72.5" text-anchor="end">focused</text>

    <path class="leader" d="M188.5 52 V84 H150"/>
    <text class="caption" x="147" y="86.5" text-anchor="end">running</text>

    <path class="leader" d="M279.5 52 V70 H300"/>
    <text class="caption" x="303" y="72.5">pinned, not running</text>
  </g>
</svg>
